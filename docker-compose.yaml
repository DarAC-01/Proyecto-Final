version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: omni_mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: punto_venta_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: adminpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  postgres-db:
    image: postgres:15
    container_name: omni_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: finanzas_auditoria_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  sqlserver-db:
    image: mcr.microsoft.com/azure-sql-edge
    container_name: omni_sqlserver
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "AdminPassword123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  mysql_data:
  postgres_data:
  sqlserver_data: